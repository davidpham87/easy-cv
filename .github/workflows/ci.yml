name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  clojure-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Prepare java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Install clojure tools
      uses: DeLaGuardo/setup-clojure@12.5
      with:
        cli: 'latest'
    - name: Cache deps.edn, .shadow-cljs and node modules
      uses: actions/cache@v4
      with:
        path: |
          .shadow-cljs
          ~/.m2/repository
          ~/.gitlibs
          ~/.deps.clj
          .cpcache
          node_modules
          resources
        key: ${{ runner.os }}-ci-${{ hashFiles('deps.edn', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-ci-
    - name: Run tests
      run: clojure -X:test


  shadow-cljs-compile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Prepare java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Install clojure tools
      uses: DeLaGuardo/setup-clojure@12.5
      with:
        cli: 'latest'
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Cache deps.edn, .shadow-cljs and node modules
      uses: actions/cache@v4
      with:
        path: |
          .shadow-cljs
          ~/.m2/repository
          ~/.gitlibs
          ~/.deps.clj
          .cpcache
          node_modules
        key: ${{ runner.os }}-ci-${{ hashFiles('deps.edn', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-ci-
    - name: Install npm dependencies
      run: npm install
    - name: Prepare js shims and assets
      run: npm run assets:copy
    - name: Build Tailwind CSS
      run: npm run css:build
    - name: Smoke check clojure -M:shadow-cljs compile app
      run: clojure -M:shadow-cljs compile app
    - name: Compile shadow-cljs app
      run: npx shadow-cljs compile app
    - name: Compile and run shadow-cljs node tests
      run: npx shadow-cljs compile test
